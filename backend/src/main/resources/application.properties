# Application Name
spring.application.name=Learning-platform

# Server Configuration
server.port=8080

# Firebase Configuration - path to your service account key
firebase.config.path=classpath:serviceAccountKey.json

# Security Configuration (optional for basic auth during testing)
spring.security.user.name=admin
spring.security.user.password=admin

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.javaguides.Learning.platform=DEBUG

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
